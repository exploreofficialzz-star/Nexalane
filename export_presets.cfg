; NEXALANE export presets (Godot 4.7.x). This file MUST live in the project root - Godot ignores export_presets.cfg
; anywhere else (v0.4.4 kept it in build/, so `--export-*` failed with "invalid preset").
; Signing material and store credentials are intentionally omitted: set them in Project > Export, or through the
; environment variables documented in docs/BUILD_COMMANDS.md. Never commit keystores or passwords.
;
; AAB (Google Play) needs the Android build template: Project > Install Android Build Template... (once).

[preset.0]

name="Android Debug"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="docs/*, tools/*, tests/*, store/*, build/*, *.md, assets/icon/nexalane_icon_master.png"
export_path="build/nexalane_debug.apk"

[preset.0.options]

gradle_build/use_gradle_build=false
gradle_build/export_format=0
architectures/arm64-v8a=true
architectures/armeabi-v7a=false
architectures/x86=false
architectures/x86_64=false
package/unique_name="com.chastech.nexalane"
package/name="NEXALANE: 3D Endless Runner"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
version/code=6
version/name="0.4.6"
launcher_icons/main_192x192="res://assets/icon/nexalane_icon_192.png"
launcher_icons/adaptive_foreground_432x432="res://assets/icon/nexalane_adaptive_fg_432.png"
launcher_icons/adaptive_background_432x432="res://assets/icon/nexalane_adaptive_bg_432.png"
screen/immersive_mode=true
permissions/internet=true
permissions/vibrate=true

