name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: 4.7.2-stable
  ANDROID_API_LEVEL: 35
  ANDROID_BUILD_TOOLS: 35.0.0
  PACKAGE_NAME: com.chastech.nexalane

jobs:
  build:
    name: Godot Android build and QA
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install release-gate dependencies
        run: python -m pip install --disable-pip-version-check numpy Pillow scipy

      - name: Install audio validation dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Cache Godot imports and export templates
        uses: actions/cache@v4
        with:
          path: |
            .godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', '**/*.gd', '**/*.tscn', '**/*.tres', '**/*.glb', '**/*.png', '**/*.wav', '**/*.ogg', '**/*.ttf', '**/*.csv') }}
          restore-keys: |
            godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-

      - name: Install Godot ${{ env.GODOT_VERSION }} and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          godot_url="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          templates_url="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          curl --fail --location --retry 3 --output /tmp/godot.zip "$godot_url"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_dir"
          curl --fail --location --retry 3 --output /tmp/templates.tpz "$templates_url"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$template_dir/"
          godot --version
          test -f "$template_dir/android_debug.apk"
          test -f "$template_dir/android_release.apk"

      - name: Import project assets
        env:
          GODOT_SILENCE_ROOT_WARNING: '1'
        run: godot --headless --path . --import

      - name: Run Python release gates
        run: python tools/release_gate.py

      - name: Validate generated release report
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          version = re.search(r'product_version="([^"]+)"', Path('project.godot').read_text()).group(1)
          report = json.loads(Path(f'docs/RELEASE_GATE_{version}.json').read_text())
          assert all(value == 'PASS' for value in report['gates'].values()), report
          print('All static release gates passed for', version)
          PY

      # The two engine steps below run the real game inside Godot (headless). They are informational
      # (continue-on-error) so they can never block an APK, but their log shows the exact script errors that a
      # release APK on a phone hides: open the step output, or download the "nexalane-engine-logs" artifact.
      - name: Engine smoke test - boot the game headless and list script errors
        continue-on-error: true
        shell: bash
        env:
          GODOT_SILENCE_ROOT_WARNING: '1'
        run: |
          mkdir -p build
          set +e
          timeout 150 godot --headless --path . --quit-after 240 > build/engine_smoke.log 2>&1
          code=$?
          set -e
          echo "godot exit code: ${code}"
          echo "===== first 150 lines of engine output (includes the [NEXALANE-BOOT] trail) ====="
          head -n 150 build/engine_smoke.log
          echo "===== lines that look like errors ====="
          grep -nE "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|Failed to instantiate|USER ERROR|ERROR:|Invalid (call|get index|set index|access)|Cannot (call|infer)|not declared" build/engine_smoke.log | head -n 100 || true
          if grep -qE "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|Failed to instantiate" build/engine_smoke.log; then
            echo "::error title=Engine smoke test::The game logged script errors while booting. See the output above."
            exit 1
          fi

      - name: Engine QA harness - content, save, planner and service checks
        continue-on-error: true
        shell: bash
        env:
          GODOT_SILENCE_ROOT_WARNING: '1'
        run: |
          mkdir -p build
          set +e
          timeout 240 godot --headless --path . res://tests/QA.tscn > build/engine_qa.log 2>&1
          code=$?
          set -e
          tail -n 80 build/engine_qa.log
          echo "godot exit code: ${code}"
          exit ${code}

      - name: Upload engine logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexalane-engine-logs-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/engine_smoke.log
            build/engine_qa.log

      # Debug build: no secrets needed. It shows a startup report on screen when the game cannot start, and on
      # a debug build script errors are captured too. It is signed with a throw-away key, so uninstall the
      # release build from the phone before installing it (and vice versa).
      - name: Create debug keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore "$RUNNER_TEMP/nexalane-debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Export debug APK
        continue-on-error: true
        env:
          GODOT_SILENCE_ROOT_WARNING: '1'
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/nexalane-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android Debug" build/nexalane_debug.apk
          test -s build/nexalane_debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexalane-debug-apk-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: build/nexalane_debug.apk

      - name: Prepare production signing keystore
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing GitHub Actions secret ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing GitHub Actions secret ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing GitHub Actions secret ANDROID_KEY_ALIAS}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexalane-release.keystore"
          test -s "$RUNNER_TEMP/nexalane-release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/nexalane-release.keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Export signed production APK
        if: github.event_name != 'pull_request'
        env:
          GODOT_SILENCE_ROOT_WARNING: '1'
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/nexalane-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build
          godot --headless --path . --install-android-build-template --export-release "Android Release APK" build/nexalane_release.apk
          test -s build/nexalane_release.apk

      - name: Export signed production AAB
        if: github.event_name != 'pull_request'
        env:
          GODOT_SILENCE_ROOT_WARNING: '1'
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/nexalane-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Android Release (AAB)" build/nexalane_release.aab
          test -s build/nexalane_release.aab

      - name: Upload Android artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nexalane-android-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/nexalane_release.apk
            build/nexalane_release.aab
